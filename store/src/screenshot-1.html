<!DOCTYPE html>
<html data-size="1280x800">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  :root { --w: 1280px; --h: 800px; }
  body { display: grid; grid-template-columns: 1fr 520px; align-items: center; gap: 56px; padding: 0 80px; }
  h1 { font-size: 54px; line-height: 1.1; letter-spacing: -.02em; margin: 28px 0 18px; }
  h1 em { font-style: normal; color: var(--accent); }
  p.lede { font-size: 21px; color: var(--muted); max-width: 520px; }
  ul { list-style: none; padding: 0; margin-top: 30px; display: grid; gap: 12px; font-size: 18px; }
  li::before { content: "✓"; color: var(--accent); font-weight: 700; margin-right: 10px; }
  .popup { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(60, 40, 20, .18); }
  .popup iframe { display: block; width: 380px; height: 560px; border: 0; }
  body { grid-template-columns: 1fr 382px; }
</style>
</head>
<body>
  <div>
    <div class="brand"><img src="../../extension/icons/128.png" width="56" height="56" alt=""><b>Tamal</b></div>
    <h1>Read Malayalam in<br><em>Tamil letters</em></h1>
    <p class="lede">Paste Malayalam and read it in Tamil script as you type. The words stay Malayalam; only the letters change.</p>
    <ul>
      <li>Works offline, right in your browser</li>
      <li>Convert a selection or a whole page</li>
      <li>No tracking. Nothing leaves your device</li>
    </ul>
  </div>
  <!-- The real extension popup, filled with sample text. -->
  <div class="popup"><iframe id="popup" src="../../extension/popup.html"></iframe></div>
  <script>
    const frame = document.getElementById('popup');
    frame.onload = () => {
      const doc = frame.contentDocument, input = doc.getElementById('input');
      input.value = 'എനിക്ക് മലയാളം അറിയാം.\nനിങ്ങൾക്ക് സുഖമാണോ?\nനാളെ നമുക്ക് കടപ്പുറത്ത് പോകാം.';
      input.dispatchEvent(new Event('input'));
      input.blur();
      frame.style.height = `${doc.body.offsetHeight}px`;
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  :root {
    --bg: #f7f3ec; --panel: #fff; --ink: #1d1c1a; --muted: #6b6860; --line: #e6dfd2;
    --accent: #b4482c; --accent-ink: #fff; --accent-soft: #f5e4dc; --ok: #3c7a4a;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --panel: #22211e; --ink: #ecebe6; --muted: #9a978e; --line: #34322e;
      --accent: #e0785a; --accent-ink: #1d1c1a; --accent-soft: #3a2721; --ok: #7cc28b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 380px; padding: 14px; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .ml { font-family: "Malayalam Sangam MN", "Noto Sans Malayalam", "Kartika", system-ui, sans-serif; }
  .ta { font-family: "Tamil Sangam MN", "Noto Sans Tamil", "Latha", system-ui, sans-serif; }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header img { width: 30px; height: 30px; border-radius: 22%; }
  header b { font-size: 17px; letter-spacing: -.01em; }
  header small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 1px 2px rgba(60, 40, 20, .06); }
  .pane { padding: 10px 12px 12px; }
  .pane + .pane { border-top: 1px solid var(--line); position: relative; }
  .head { display: flex; align-items: center; justify-content: space-between; min-height: 24px; margin-bottom: 4px; }
  .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .chip { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 24px; height: 24px;
    display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--panel); font-size: 13px; font-weight: 700; }

  textarea { display: block; width: 100%; min-height: 84px; max-height: 180px; resize: none; padding: 0; border: 0;
    outline: none; background: transparent; color: var(--ink); font-size: 17px; line-height: 1.65; }
  textarea::placeholder { color: var(--muted); opacity: .8; }
  #output { min-height: 84px; max-height: 200px; overflow: auto; white-space: pre-wrap; font-size: 18px; line-height: 1.7; }
  #output:empty::before { content: attr(data-empty); color: var(--muted); opacity: .8; font: 14px/1.6 -apple-system, system-ui, sans-serif; }

  .ghost { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; font-size: 12px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); }
  .ghost:hover { color: var(--ink); border-color: var(--muted); }
  .ghost[hidden] { display: none; }
  .ghost.done { color: var(--ok); border-color: currentColor; }

  .primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 12px;
    padding: 10px 14px; border: 0; border-radius: 11px; background: var(--accent); color: var(--accent-ink);
    font-size: 14px; font-weight: 600; }
  .primary:hover { filter: brightness(1.06); }
  .primary:disabled { opacity: .7; cursor: default; }

  #status { min-height: 18px; margin: 8px 2px 0; font-size: 12px; color: var(--muted); text-align: center; }
  #status.ok { color: var(--ok); }
  footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; padding: 8px 2px 0;
    border-top: 1px dashed var(--line); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>
  <header>
    <img src="icons/48.png" alt="">
    <div><b>Tamal</b><small>Malayalam in <span class="ta">தமிழ்</span> letters</small></div>
  </header>

  <div class="card">
    <div class="pane">
      <div class="head">
        <span class="label">Malayalam</span>
        <button id="clear" class="ghost" hidden>Clear</button>
      </div>
      <textarea id="input" class="ml" lang="ml" placeholder="Paste or type Malayalam here…" autofocus></textarea>
    </div>
    <div class="pane">
      <span class="chip" aria-hidden="true">↓</span>
      <div class="head">
        <span class="label">Tamil script</span>
        <button id="copy" class="ghost" hidden>Copy</button>
      </div>
      <div id="output" class="ta" lang="ta" aria-live="polite" data-empty="The Tamil-script version shows up here as you type."></div>
    </div>
  </div>

  <button id="page" class="primary">Convert this page</button>
  <div id="status" role="status"></div>

  <footer>
    <span>Tip: select text, then right-click</span>
    <span>Offline · private</span>
  </footer>

  <script src="tamal.js"></script>
  <script src="popup.js"></script>
</body>
</html>
